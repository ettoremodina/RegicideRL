  <text class="utility" x="739.2" y="355" text-anchor="middle">50%</text>
  <line class="grid" x1="850.0" y1="45" x2="850.0" y2="330"/>
  <text class="utility" x="850.0" y="355" text-anchor="middle">60%</text>
  <text class="label" x="24" y="87">ISMCTS</text>
  <line x1="548.5" y1="82" x2="759.0" y2="82" stroke="#101A24" stroke-width="3"/>
  <line x1="548.5" y1="74" x2="548.5" y2="90" stroke="#101A24" stroke-width="2"/>
  <line x1="759.0" y1="74" x2="759.0" y2="90" stroke="#101A24" stroke-width="2"/>
