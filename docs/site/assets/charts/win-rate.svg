<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 385" role="img" aria-labelledby="title desc">
  <title id="title">Solo win rate by agent</title>
  <desc id="desc">ISMCTS won 42 percent, PIMC 24 percent, Heuristic and Random zero percent; horizontal lines show Wilson 95 percent confidence intervals.</desc>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #101A24; }
    .utility { font-family: "Cascadia Code", Consolas, monospace; font-size: 13px; fill: #536577; }
    .label { font-size: 16px; font-weight: 650; }
    .value { font-size: 15px; font-weight: 700; }
    .grid { stroke: #D7D8D2; stroke-width: 1; }
  </style>
  <rect width="920" height="385" rx="14" fill="#FBF9F4"/>
  <line class="grid" x1="185.0" y1="45" x2="185.0" y2="330"/>
  <text class="utility" x="185.0" y="355" text-anchor="middle">0%</text>
  <line class="grid" x1="295.8" y1="45" x2="295.8" y2="330"/>
  <text class="utility" x="295.8" y="355" text-anchor="middle">10%</text>
  <line class="grid" x1="406.7" y1="45" x2="406.7" y2="330"/>
