  <text class="label" x="24" y="159">PIMC</text>
  <line x1="370.0" y1="154" x2="553.3" y2="154" stroke="#101A24" stroke-width="3"/>
  <line x1="370.0" y1="146" x2="370.0" y2="162" stroke="#101A24" stroke-width="2"/>
  <line x1="553.3" y1="146" x2="553.3" y2="162" stroke="#101A24" stroke-width="2"/>
  <circle cx="451.0" cy="154" r="9" fill="#123D3A" stroke="#FBF9F4" stroke-width="3"/>
